<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monitor.ia — Gestão</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="http://127.0.0.1:5000/static/app.css"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js" defer></script><script src="http://127.0.0.1:5000/static/app.js" defer></script></head>
<body><section id="authScreen" class="auth-screen"><div class="auth-card"><div class="brand"><span class="brand-mark">M</span><span>monitor<span class="accent">.ia</span></span></div><p class="muted mt-3">Gestão clara. Entregas no prazo.</p><form id="authForm"><label class="form-label">Nome <small class="muted">(apenas no primeiro cadastro)</small></label><input id="authName" class="form-control mb-3" placeholder="Seu nome"><label class="form-label">E-mail</label><input id="authEmail" class="form-control mb-3" type="email" required><label class="form-label">Senha</label><input id="authPassword" class="form-control mb-3" type="password" minlength="8" required><button class="btn btn-primary w-100">Entrar</button><div id="authError" class="error mt-3"></div></form><div class="tiny muted mt-3">O primeiro acesso cria a conta administradora.</div></div></section>
<div id="app" class="shell d-none"><aside class="sidebar"><a class="brand" href="#dashboard"><span class="brand-mark">M</span><span>monitor<span class="accent">.ia</span></span></a><div class="workspace-label">WORKSPACE</div><nav id="nav"><a data-page="dashboard" class="nav-link active"><i class="bi bi-grid-1x2"></i>Dashboard</a><a data-page="projects" class="nav-link"><i class="bi bi-kanban"></i>Projetos</a><a data-page="tasks" class="nav-link"><i class="bi bi-check2-square"></i>Tarefas</a><a data-page="calendar" class="nav-link"><i class="bi bi-calendar3"></i>Calendário</a><a data-page="reports" class="nav-link"><i class="bi bi-bar-chart"></i>Relatórios</a><a data-page="import" class="nav-link"><i class="bi bi-file-earmark-arrow-up"></i>Importar TXT</a></nav><div class="sidebar-bottom"><a data-page="settings" class="nav-link"><i class="bi bi-gear"></i>Configurações</a><div class="profile"><span class="avatar">M</span><div><strong id="userName">Usuário</strong><small>Workspace pessoal</small></div><button id="logout" class="icon-btn ms-auto" title="Sair"><i class="bi bi-box-arrow-right"></i></button></div></div></aside>
<main class="main"><header class="topbar"><button id="menuToggle" class="icon-btn d-lg-none"><i class="bi bi-list"></i></button><div><div class="eyebrow">GESTÃO DE OPERAÇÕES</div><h1 id="pageTitle">Dashboard</h1></div><button class="btn btn-primary" id="newTask"><i class="bi bi-plus-lg"></i> Nova tarefa</button></header><section id="pageContent" class="content"></section></main></div>
<div class="modal fade" id="taskModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><div class="modal-header"><div><div class="eyebrow">TAREFA</div><h5 class="modal-title">Nova tarefa</h5></div><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body"><form id="taskForm"><input type="hidden" id="taskId"><label class="form-label">Título</label><input id="taskTitle" class="form-control mb-3" required maxlength="220"><label class="form-label">Descrição</label><textarea id="taskDescription" class="form-control mb-3" rows="3"></textarea><div class="row g-3"><div class="col-md-6"><label class="form-label">Projeto</label><select id="taskProject" class="form-select"></select></div><div class="col-md-6"><label class="form-label">Responsável</label><select id="taskOwner" class="form-select"></select></div><div class="col-md-4"><label class="form-label">Status</label><select id="taskStatus" class="form-select"><option>A fazer</option><option>Em andamento</option><option>Aguardando terceiros</option><option>Finalizado</option><option>Cancelado</option></select></div><div class="col-md-4"><label class="form-label">Prioridade</label><select id="taskPriority" class="form-select"><option>Baixa</option><option>Média</option><option>Alta</option><option>Crítica</option></select></div><div class="col-md-4"><label class="form-label">Prazo</label><input id="taskDue" type="date" class="form-control"></div></div><div class="d-flex justify-content-between align-items-center mt-4"><button id="deleteTask" type="button" class="btn btn-outline-danger d-none">Excluir</button><button class="btn btn-primary ms-auto">Salvar tarefa</button></div></form><div id="taskHistory" class="mt-4"></div></div></div></div></div>
<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="toast" class="toast text-bg-dark"><div class="toast-body"></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script></body></html>
