{% load static %}<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurar Gestão</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{% static 'app.css' %}"></head><body><section class="auth-screen"><div class="auth-card"><a class="brand" href="/"><span class="brand-mark">G</span><span>Gestão</span></a><p class="muted mt-3">Crie a conta administradora inicial.</p>{% for message in messages %}<div class="error mb-2">{{ message }}</div>{% endfor %}<form method="post">{% csrf_token %}<label class="form-label">Nome</label><input class="form-control mb-3" name="name" required><label class="form-label">E-mail</label><input class="form-control mb-3" name="email" type="email" required><label class="form-label">Senha (mínimo 8 caracteres)</label><input class="form-control mb-3" name="password" type="password" minlength="8" required><button class="btn btn-primary w-100">Criar conta</button></form></div></section></body></html>
