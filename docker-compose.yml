services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-monitoria}
      MYSQL_USER: ${MYSQL_USER:-monitoria}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-monitoria_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_MODE: mysql
    ports: ["5000:5000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  mysql_data:
